[project]
name = "episodata"
version = "0.2.0"
description = "Unified episode dataset library for world models and control"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Leor Cohen" }]
keywords = [
    "reinforcement-learning",
    "world-models",
    "episode",
    "dataset",
    "replay-buffer",
    "zarr",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24", "tensorstore>=0.1"]

[project.urls]
Homepage = "https://github.com/leor-c/episodata"
Repository = "https://github.com/leor-c/episodata"
Issues = "https://github.com/leor-c/episodata/issues"

[project.optional-dependencies]
gym = ["gymnasium>=0.29"]
dev = ["pytest>=8", "zarr>=3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["episodata"]

[tool.hatch.build.targets.sdist]
include = [
    "/episodata",
    "/tests",
    "/docs",
    "/examples",
    "/README.md",
    "/LICENSE",
]
