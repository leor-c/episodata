[project]
name = "episodata"
version = "0.1.0"
description = "Unified episode dataset library for world models and control"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "zarr>=3"]

[project.optional-dependencies]
gym = ["gymnasium>=0.29"]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["episodata"]